<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GigFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: #edf2ff;
      }
      .card {
        max-width: 640px;
        padding: 32px 28px;
        border-radius: 18px;
        background: rgba(19, 28, 45, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      }
      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        line-height: 1.6;
        color: #a5b4d3;
      }
      code {
        background: rgba(255,255,255,0.06);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>GigFlow</h1>
      <p>
        This project is a Next.js app. To run it locally, use:
      </p>
      <p><code>npm install</code></p>
      <p><code>npm run dev</code></p>
      <p>
        Then open <code>http://localhost:3000</code> in the browser.
      </p>
    </div>
  </body>
</html>
